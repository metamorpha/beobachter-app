name: Build iOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: src
        run: flutter pub get

      - name: Analyze
        working-directory: src
        run: flutter analyze

      - name: Test
        working-directory: src
        run: flutter test

      # Pull Requests und Pushes auf main prüfen nur, ob die App kompiliert
      # (US-801). Signiert und zu TestFlight hochgeladen wird nur manuell
      # (Run workflow) oder bei einem Tag v* — und nur, wenn die Secrets da sind.
      - name: Decide signing
        id: mode
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "sign=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CERT" ] || [ -z "$PROFILE" ] || [ -z "$TEAM" ]; then
            echo "::warning title=Keine iOS-Signatur::Secrets IOS_DIST_CERT_P12_BASE64, IOS_PROVISIONING_PROFILE_BASE64 oder IOS_TEAM_ID fehlen – es wird nur unsigniert gebaut, kein Upload zu TestFlight (siehe README)."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          else
            echo "sign=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (unsigned)
        if: steps.mode.outputs.sign != 'true'
        working-directory: src
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      # Zertifikat in eine eigene Keychain, Profil installieren und die
      # Signier-Einstellungen für das Runner-Target als Signing.xcconfig
      # schreiben (eingebunden über Release.xcconfig, nicht eingecheckt).
      - name: Configure signing
        if: steps.mode.outputs.sign == 'true'
        working-directory: src/ios
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$DIR/$PROFILE_UUID.mobileprovision"
          done

          cat > Flutter/Signing.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE_UUID
          EOF

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>de.beobachter.beobachterApp</key><string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        if: steps.mode.outputs.sign == 'true'
        working-directory: src
        run: |
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      # Upload zu TestFlight (US-802). Ohne API-Key bleibt es beim Artefakt.
      - name: Upload to TestFlight
        if: steps.mode.outputs.sign == 'true'
        working-directory: src
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          if [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ] || [ -z "$API_KEY_P8_BASE64" ]; then
            echo "::warning title=Kein TestFlight-Upload::Secrets APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID oder APPSTORE_API_KEY_P8_BASE64 fehlen – die IPA liegt nur als Artefakt vor."
            exit 0
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
          xcrun altool --upload-app --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
          echo "### TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "Build ${{ github.run_number }} hochgeladen. Nach der Verarbeitung durch Apple erscheint er in TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: steps.mode.outputs.sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beobachter-app-ios
          path: src/build/ios/ipa/*.ipa
          retention-days: 30

      - name: Clean up keychain
        if: always() && steps.mode.outputs.sign == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
