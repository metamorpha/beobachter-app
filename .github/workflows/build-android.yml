name: Build Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: src
        run: flutter pub get

      - name: Analyze
        working-directory: src
        run: flutter analyze

      - name: Test
        working-directory: src
        run: flutter test

      # Fester Release-Schlüssel, damit Updates ohne Deinstallation (und ohne
      # Verlust der lokalen Spieldaten) möglich sind (US-705). Ohne Secrets
      # entsteht eine debug-signierte APK.
      - name: Configure release signing
        working-directory: src/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=Keine Release-Signatur::Secret ANDROID_KEYSTORE_BASE64 fehlt – die APK wird mit dem Debug-Schlüssel signiert und lässt sich nicht über eine release-signierte Version installieren."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        working-directory: src
        run: flutter build apk --release

      # Die App soll ohne Netzwerk- oder Speicher-Berechtigung auskommen (US-705,
      # TC-7061). Plugins können beim Zusammenführen des Manifests Berechtigungen
      # einbringen – daher die fertige APK prüfen. Die von androidx automatisch
      # angelegte App-interne DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION ist
      # unkritisch und wird ignoriert. Unerwartete Berechtigungen erzeugen eine
      # Warnung, brechen den Build aber nicht ab.
      - name: Check permissions
        working-directory: src
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          PERMS=$("$AAPT2" dump permissions build/app/outputs/flutter-apk/app-release.apk \
            | grep '^uses-permission' | grep -o "name='[^']*'" | cut -d"'" -f2 \
            | grep -v 'DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION$' || true)
          {
            echo "### Berechtigungen der APK"
            if [ -z "$PERMS" ]; then
              echo "Keine Berechtigungen angefordert."
            else
              echo "$PERMS" | sed 's/^/- `/; s/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PERMS" ]; then
            echo "::warning title=Unerwartete Berechtigungen::Die APK fordert an: $(echo $PERMS | tr ' ' ',')"
          else
            echo "Keine Berechtigungen angefordert."
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beobachter-app-android
          path: src/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
