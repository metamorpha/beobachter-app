name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: src
        run: flutter pub get

      - name: Analyze
        working-directory: src
        run: flutter analyze

      - name: Test
        working-directory: src
        run: flutter test

      # Fester Release-Schlüssel, damit Updates ohne Deinstallation (und ohne
      # Verlust der lokalen Spieldaten) möglich sind (US-705). Ohne Secrets
      # entsteht eine debug-signierte APK.
      - name: Configure release signing
        working-directory: src/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=Keine Release-Signatur::Secret ANDROID_KEYSTORE_BASE64 fehlt – die APK wird mit dem Debug-Schlüssel signiert und lässt sich nicht über eine release-signierte Version installieren."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        working-directory: src
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beobachter-app-android
          path: src/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
