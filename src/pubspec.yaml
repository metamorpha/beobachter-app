name: beobachter_app
description: "Schiedsrichterbeobachter — Live-Ereigniserfassung für Fußballspiele"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Datenbank
  drift: ^2.22.0
  drift_flutter: ^0.2.4

  # State Management
  flutter_riverpod: ^2.6.1

  # Utilities
  uuid: ^4.5.1
  file_picker: ^8.0.0
  window_manager: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code-Generierung für Drift
  drift_dev: ^2.22.0
  build_runner: ^2.4.14

  # Mocking für Tests
  mocktail: ^1.0.4
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  # Inter (SIL Open Font License, siehe assets/fonts/inter/OFL.txt) —
  # gebündelt, damit die App offline überall gleich aussieht (US-601).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
